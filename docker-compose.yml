services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: nau
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nau_dev_password}
      POSTGRES_DB: nau_advisor
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nau -d nau_advisor"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
